name: keep-alive

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o body.txt -w "%{http_code}" --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/stores?select=id&limit=1")
          echo "HTTP ${code}"
          head -c 200 body.txt; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
